name: ComplexCommute
options:
  bundleIdPrefix: scottai
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# The app and its widget extension are versioned and signed as one.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6S26L64S3C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
packages:
  CommuteKit:
    path: Packages/CommuteKit
targets:
  ComplexCommute:
    type: application
    platform: iOS
    sources:
      - ComplexCommute
      - Shared
    # Background refresh needs real Info.plist entries; the INFOPLIST_KEY_ settings below still merge in.
    info:
      path: ComplexCommute/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # `location` keeps a trip in progress followed (and its Live Activity current) with the phone locked.
        UIBackgroundModes: [fetch, location]
        BGTaskSchedulerPermittedIdentifiers: [scottai.commuter-app.refresh]
        NSSupportsLiveActivities: true
        # Where a tap on a widget lands: a commute, or a station's board. See `AppLink`.
        CFBundleURLTypes:
          - CFBundleURLName: scottai.commuter-app
            CFBundleURLSchemes: [complexcommute]
    # Shared with the widgets: the downloaded schedules, the list of commutes, and agency API keys.
    entitlements:
      path: ComplexCommute/ComplexCommute.entitlements
      properties:
        com.apple.security.application-groups: [group.scottai.commuter-app]
    dependencies:
      - target: ComplexCommuteWidgets
      - package: CommuteKit
        product: CommuteCore
      - package: CommuteKit
        product: GTFSKit
      - package: CommuteKit
        product: TransitRouting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: scottai.commuter-app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Commute
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: While a trip is in progress, your location lets Commute notice when you reach or leave a station, even with the app closed, so your trip and Lock Screen stay current.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location is used as the starting point of trips and to keep route options up to date while you travel, including on the Lock Screen while a trip is in progress.

  # The Live Activity: Lock Screen, Dynamic Island, and the Watch's Smart Stack (mirrored from the phone;
  # there is no Watch app). And the Home Screen widgets: a commute, and departures near the rider.
  ComplexCommuteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ComplexCommuteWidgets
      - Shared
      # For the accent color, so the widgets are tinted like the app.
      - ComplexCommute/Assets.xcassets
    info:
      path: ComplexCommuteWidgets/Info.plist
      properties:
        CFBundleDisplayName: Commute
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The departures widget finds the stations around the rider itself, under the app's own permission.
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: Your location is used to show departures from the stations and stops around you.
    entitlements:
      path: ComplexCommuteWidgets/ComplexCommuteWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.scottai.commuter-app]
    dependencies:
      - package: CommuteKit
        product: CommuteCore
      - package: CommuteKit
        product: GTFSKit
      - package: CommuteKit
        product: TransitRouting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: scottai.commuter-app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

